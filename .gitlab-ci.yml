# =============================================================================
# ValIO — Primary CI/CD Pipeline (GitLab 17.x)
# =============================================================================
# Pipeline architecture (DAG-driven, six stages):
#   1. build    — restore + compile .NET solution, publish per-platform single-
#                 file CLI binaries (5-way parallel:matrix), build the Astro
#                 docs site and the npm shim package.
#   2. test     — run NUnit suite with JUnit + Cobertura reports, smoke-test the
#                 linux-x64 binary by invoking --help.
#   3. pack     — produce NuGet packages (.NET tool + 16 libs) with version
#                 derived from tag or pipeline id.
#   4. publish  — tag-only: push NuGets to nuget.org and per-platform npm
#                 packages, then the main npm shim (depends on platforms).
#   5. pages    — deploy the Starlight docs to GitLab Pages on default branch.
#   6. release  — tag-only: create the matching GitLab Release with notes
#                 extracted from CHANGELOG.md and asset links to the packages.
# =============================================================================

# -----------------------------------------------------------------------------
# Workflow rules — gate which events spawn a pipeline.
# -----------------------------------------------------------------------------
workflow:
  rules:
    # Merge-request pipelines (preferred over branch pipelines for MRs)
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Default branch commits
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # Semver release tags (e.g. v1.2.3)
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

# -----------------------------------------------------------------------------
# Global defaults — applied to every job unless overridden.
# -----------------------------------------------------------------------------
default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - api_failure

# -----------------------------------------------------------------------------
# Global variables.
# -----------------------------------------------------------------------------
variables:
  DOTNET_VERSION: "10.0"
  NODE_VERSION: "22"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget"
  # GIT_DEPTH "20" keeps clone fast while leaving room for changelog/version lookups.
  GIT_DEPTH: "20"

# -----------------------------------------------------------------------------
# Pipeline stages.
# -----------------------------------------------------------------------------
stages:
  - build
  - test
  - pack
  - publish
  - pages
  - release

# -----------------------------------------------------------------------------
# Reusable cache anchors — keyed off lockfiles via `files:` with fallbacks.
# -----------------------------------------------------------------------------
.cache_nuget: &cache_nuget
  key:
    files:
      - Directory.Packages.props
      - "**/*.csproj"
    prefix: "nuget"
  fallback_keys:
    - "nuget-default"
  paths:
    - .nuget/
  policy: pull-push

.cache_docs_node: &cache_docs_node
  key:
    files:
      - docs-site/package-lock.json
    prefix: "docs"
  fallback_keys:
    - "docs-default"
  paths:
    - docs-site/node_modules/
  policy: pull-push

.cache_shim_node: &cache_shim_node
  key:
    files:
      - packaging/npm/valio/package-lock.json
    prefix: "shim"
  fallback_keys:
    - "shim-default"
  paths:
    - packaging/npm/valio/node_modules/
  policy: pull-push

# =============================================================================
# Stage: build
# =============================================================================

build:dotnet:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    - <<: *cache_nuget
  script:
    - dotnet restore ValIO.sln
    - dotnet build ValIO.sln -c Release --no-restore
  artifacts:
    name: "dotnet-build-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 hour
    paths:
      - "**/bin/Release/"
      - "**/obj/Release/"

build:binaries:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    - <<: *cache_nuget
      policy: pull
  parallel:
    matrix:
      - { RID: "win-x64",     NPM_NAME: "win32-x64",     EXT: ".exe" }
      - { RID: "linux-x64",   NPM_NAME: "linux-x64",     EXT: "" }
      - { RID: "linux-arm64", NPM_NAME: "linux-arm64",   EXT: "" }
      - { RID: "osx-x64",     NPM_NAME: "darwin-x64",    EXT: "" }
      - { RID: "osx-arm64",   NPM_NAME: "darwin-arm64",  EXT: "" }
  script:
    - >
      dotnet publish src/ValIO.Cli/ValIO.Cli.csproj
      -c Release
      -r $RID
      --self-contained
      -p:PublishSingleFile=true
      -p:DebugType=embedded
      -o publish/$NPM_NAME
    - cp publish/$NPM_NAME/valio$EXT packaging/npm/platforms/$NPM_NAME/
  artifacts:
    name: "binary-$NPM_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
    paths:
      - packaging/npm/platforms/$NPM_NAME/

build:docs-site:
  stage: build
  image: node:22-alpine
  cache:
    - <<: *cache_docs_node
  script:
    - cd docs-site
    - npm ci
    - npm run build
  artifacts:
    name: "docs-site-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
    paths:
      - docs-site/dist/

build:npm-shim:
  stage: build
  image: node:22-alpine
  cache:
    - <<: *cache_shim_node
  script:
    - cd packaging/npm/valio
    - npm ci --ignore-scripts
    - npm run build
  artifacts:
    name: "npm-shim-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 day
    paths:
      - packaging/npm/valio/dist/

# =============================================================================
# Stage: test
# =============================================================================

test:dotnet:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  needs:
    - job: build:dotnet
      artifacts: true
  cache:
    - <<: *cache_nuget
      policy: pull
  script:
    - >
      dotnet test ValIO.sln
      -c Release
      --no-build
      --logger "junit;LogFilePath=test-results.xml"
      --collect:"XPlat Code Coverage"
      --
      DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
  artifacts:
    name: "test-results-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    when: always
    paths:
      - "**/test-results.xml"
      - "**/coverage.cobertura.xml"
    reports:
      junit: "**/test-results.xml"
      coverage_report:
        coverage_format: cobertura
        path: "**/coverage.cobertura.xml"

test:smoke-binary:
  stage: test
  image: ubuntu:24.04
  needs:
    - job: build:binaries
      parallel:
        matrix:
          - { NPM_NAME: "linux-x64" }
      artifacts: true
  script:
    - chmod +x packaging/npm/platforms/linux-x64/valio
    - packaging/npm/platforms/linux-x64/valio --help

# =============================================================================
# Stage: pack
# =============================================================================

pack:nuget:
  stage: pack
  image: mcr.microsoft.com/dotnet/sdk:10.0
  needs:
    - job: build:dotnet
      artifacts: true
    - job: test:dotnet
      artifacts: false
  cache:
    - <<: *cache_nuget
      policy: pull
  script:
    # Tag-driven release version, otherwise a CI-suffixed prerelease.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="0.1.0-ci.${CI_PIPELINE_IID}"
      fi
    - echo "Packing version $VERSION"
    - dotnet pack ValIO.sln -c Release -o nupkgs -p:Version=$VERSION
  artifacts:
    name: "nupkgs-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - nupkgs/

# =============================================================================
# Stage: publish — only on semver tags (vX.Y.Z)
# =============================================================================

publish:nuget:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:10.0
  needs:
    - job: pack:nuget
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: nuget
    url: "https://www.nuget.org/packages?q=ValIO"
  # id_tokens:
  #   # Reserved for v0.2 — switch to OIDC trust with nuget.org / Azure once available.
  #   NUGET_ID_TOKEN:
  #     aud: "https://api.nuget.org"
  script:
    - |
      for pkg in nupkgs/*.nupkg; do
        echo "Pushing $pkg"
        dotnet nuget push "$pkg" \
          --api-key "$NUGET_API_KEY" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
      done

publish:npm-platforms:
  stage: publish
  image: node:22-alpine
  needs:
    - job: build:binaries
      artifacts: true
    - job: build:npm-shim
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  parallel:
    matrix:
      - { RID: "win-x64",     NPM_NAME: "win32-x64",     EXT: ".exe" }
      - { RID: "linux-x64",   NPM_NAME: "linux-x64",     EXT: "" }
      - { RID: "linux-arm64", NPM_NAME: "linux-arm64",   EXT: "" }
      - { RID: "osx-x64",     NPM_NAME: "darwin-x64",    EXT: "" }
      - { RID: "osx-arm64",   NPM_NAME: "darwin-arm64",  EXT: "" }
  environment:
    name: "npm/$NPM_NAME"
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - cd packaging/npm/platforms/$NPM_NAME
    - npm version "$VERSION" --no-git-tag-version --allow-same-version
    - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
    - npm publish --access public

publish:npm-main:
  stage: publish
  image: node:22-alpine
  needs:
    - job: publish:npm-platforms
      artifacts: false
    - job: build:npm-shim
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: npm
    url: "https://www.npmjs.com/package/valio"
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - cd packaging/npm/valio
    - npm version "$VERSION" --no-git-tag-version --allow-same-version
    - echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
    - npm publish --access public

# =============================================================================
# Stage: pages — magic job name deploys to GitLab Pages
# =============================================================================

pages:
  stage: pages
  image: alpine:3.20
  needs:
    - job: build:docs-site
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - mv docs-site/dist public
  artifacts:
    paths:
      - public

# =============================================================================
# Stage: release — only on semver tags, creates a matching GitLab Release.
# =============================================================================

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: publish:nuget
      artifacts: false
    - job: publish:npm-main
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  variables:
    # The release-cli image lacks `sh` builtins beyond posix — keep extraction simple.
    GIT_STRATEGY: clone
  script:
    # Extract the section for the current tag from CHANGELOG.md.
    # Matches "## [vX.Y.Z]" or "## vX.Y.Z" up to the next "## " heading.
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      if [ -f CHANGELOG.md ]; then
        CHANGELOG=$(awk -v ver="$VERSION" -v tag="$CI_COMMIT_TAG" '
          $0 ~ "^## (\\[)?" tag "(\\])?" || $0 ~ "^## (\\[)?" ver "(\\])?" { found=1; next }
          found && /^## / { exit }
          found { print }
        ' CHANGELOG.md)
      fi
      if [ -z "$CHANGELOG" ]; then
        CHANGELOG="Release $CI_COMMIT_TAG"
      fi
      echo "$CHANGELOG" > release-notes.txt
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "ValIO $CI_COMMIT_TAG"
    description: "./release-notes.txt"
    assets:
      links:
        - name: "NuGet — ValIO.Cli"
          url: "https://www.nuget.org/packages/ValIO.Cli"
          link_type: package
        - name: "NuGet — all ValIO packages"
          url: "https://www.nuget.org/packages?q=ValIO"
          link_type: package
        - name: "npm — valio"
          url: "https://www.npmjs.com/package/valio"
          link_type: package
