"openapi": "3.0.4"
"info":
  "title": "Parser matrix"
  "version": "1.0.0"
"paths":
  "/items":
    "post":
      "operationId": "createItem"
      "tags":
        - "Items"
      "responses":
        "200":
          "description": "Accepted item."
          "content":
            "application/json":
              "schema":
                "oneOf":
                  -
                    "allOf":
                      -
                        "$ref": "#/components/schemas/Base"
                      -
                        "$ref": "#/components/schemas/Extra"
                  -
                    "$ref": "#/components/schemas/Alternative"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "oneOf":
                -
                  "allOf":
                    -
                      "$ref": "#/components/schemas/Base"
                    -
                      "$ref": "#/components/schemas/Extra"
                -
                  "$ref": "#/components/schemas/Alternative"
"servers":
  -
    "url": "https://api.example.test/v1"
"components":
  "schemas":
    "Base":
      "type": "object"
      "required":
        - "id"
        - "kind"
      "properties":
        "id":
          "type": "string"
        "kind":
          "type": "string"
          "enum":
            - "base"
        "label":
          "type": "string"
          "minLength": 2
          "maxLength": 24
          "description": "A constrained label."
    "State":
      "type": "string"
      "enum":
        - "ready"
        - "done"
    "Alternative":
      "type": "object"
      "required":
        - "kind"
        - "count"
      "properties":
        "kind":
          "type": "string"
          "enum":
            - "alternative"
        "count":
          "type": "integer"
          "format": "int32"
    "Extra":
      "type": "object"
      "required":
        - "extra"
      "properties":
        "extra":
          "type": "string"
    "Choice":
      "oneOf":
        -
          "allOf":
            -
              "$ref": "#/components/schemas/Base"
            -
              "$ref": "#/components/schemas/Extra"
        -
          "$ref": "#/components/schemas/Alternative"
    "Container":
      "type": "object"
      "properties":
        "choice":
          "oneOf":
            -
              "allOf":
                -
                  "$ref": "#/components/schemas/Base"
                -
                  "$ref": "#/components/schemas/Extra"
            -
              "$ref": "#/components/schemas/Alternative"
