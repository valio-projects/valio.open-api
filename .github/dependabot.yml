version: 2
updates:
  # ---------------------------------------------------------------------------
  # .NET / NuGet — Central Package Management at the repo root.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      avalonia:
        patterns:
          - "Avalonia.*"

  # ---------------------------------------------------------------------------
  # npm — docs-site (Astro + Starlight).
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5

  # ---------------------------------------------------------------------------
  # npm — main shim package.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/packaging/npm/valio"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5

  # ---------------------------------------------------------------------------
  # GitHub Actions workflows.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
